<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arleking Social</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/style.css" />
<style>
  .landing { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .landing-card { max-width: 420px; width: 100%; text-align: center; }
  .landing-title { font-size: 2.4rem; margin: 0 0 10px; }
  .landing-sub { font-size: 0.95rem; color: var(--text-dim); margin: 0 0 32px; line-height: 1.5; }
  .landing-actions { display: flex; flex-direction: column; gap: 12px; }
  .landing-footnote { margin-top: 28px; font-size: 0.78rem; color: var(--text-dim); }
</style>
</head>
<body>

  <div class="bg-hero" aria-hidden="true"></div>
  <canvas id="particles-canvas" class="particles-canvas" aria-hidden="true"></canvas>

  <main class="landing">
    <div class="landing-card">
      <h1 class="brand-name landing-title">✨ Arleking Social</h1>
      <p class="landing-sub">Tu página de enlaces, así de simple.<br />Crea la tuya en segundos y comparte todas tus redes en un solo lugar.</p>

      <div class="landing-actions">
        <a href="/admin/login?mode=register" class="btn-pill btn-gradient">Crear mi página gratis</a>
        <a href="/admin/login" class="btn-outline">Ya tengo cuenta</a>
      </div>

      <p class="landing-footnote">✨ Arleking Social</p>
    </div>
  </main>

  <script src="/js/particles.js"></script>
  <script src="/js/button-fx.js"></script>
</body>
</html>
