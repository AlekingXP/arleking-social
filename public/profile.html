<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bio Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/glass.css" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <div class="bg-hero" aria-hidden="true"></div>
  <!-- El fondo generativo, cuando hay uno elegido. Nace oculto: si no hay
       ninguno, no debe tapar la foto con un rectángulo transparente. -->
  <canvas id="wallpaper-canvas" class="wallpaper-canvas hidden" aria-hidden="true"></canvas>
  <canvas id="particles-canvas" class="particles-canvas" aria-hidden="true"></canvas>

  <!-- Age gate -->
  <section id="age-gate" class="gate hidden">
    <div class="gate-card">
      <div class="avatar-wrap">
        <img id="gate-avatar" class="avatar" src="" alt="avatar" />
      </div>
      <h1 id="gate-title" class="brand-name"></h1>
      <p id="gate-subtitle" class="tagline"></p>
      <button id="enter-btn" class="btn-pill btn-gradient">
        <span data-i18n="perfil.entrar">Entrar</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p id="gate-confirm" class="fine-print"></p>
    </div>
  </section>

  <!-- Main page -->
  <main id="main-page" class="hidden">
    <header class="profile-header">
      <div class="avatar-wrap small">
        <img id="main-avatar" class="avatar" src="" alt="avatar" />
      </div>
      <h1 id="main-name" class="brand-name"></h1>
      <p id="main-tagline" class="tagline"></p>
    </header>

    <nav id="links-list" class="links-list"></nav>

    <!-- El recorrido. Va DEBAJO de los enlaces a propósito: quien entra
         aquí viene a pulsar uno y lo tiene delante al abrir. Nace oculto y
         lo enseña main.js sólo si el perfil lo tiene activado, para que
         ninguna página existente crezca tres pantallas sin avisar. -->
    <div id="recorrido" class="recorrido hidden">

      <div class="tira" aria-hidden="true"><span class="tira-cinta" data-tira></span></div>

      <section class="escena escena-nombre" data-revelar>
        <p class="escena-etiqueta" id="recorrido-slug" data-paso></p>
        <h2 class="escena-titulo" id="recorrido-nombre" data-paso></h2>
        <p class="escena-linea" id="recorrido-tagline" data-paso></p>
      </section>

      <div class="tira" aria-hidden="true"><span class="tira-cinta" data-tira></span></div>

      <section class="escena escena-cristal" data-cristal data-revelar>
        <div class="cristal-caja" data-paso>
          <canvas class="cristal" aria-hidden="true"></canvas>
          <!-- Lo que se ve si no hay WebGL, si el aparato no da la talla o
               si el módulo no llega: una pieza dibujada, no un hueco. -->
          <div class="cristal-respaldo hidden" data-respaldo aria-hidden="true"></div>
        </div>
        <p class="escena-pie" id="recorrido-pie" data-paso></p>
      </section>

      <section class="escena escena-cierre" data-revelar>
        <button type="button" class="btn-pill btn-gradient" data-volver data-paso data-i18n="perfil.volver_a_los_enlaces">Volver a los enlaces</button>
      </section>
    </div>

    <footer class="site-footer">
      <span id="footer-text"></span>
    </footer>
  </main>

  <!-- Mapa de importacion para Three.js: debe existir antes de que se cargue
       cualquier modulo, asi que va aqui aunque vip-3d.js solo se pida cuando
       el perfil tiene badge VIP. Pesa unos 100 bytes; el modulo, no. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <!-- particles.js antes que main.js: define window.aplicarParticulas, y es
       main.js quien se lo pasa cuando tiene el perfil, para no pedirlo dos
       veces en la pagina que cargan los visitantes. -->
  <script src="/js/i18n.js"></script>
  <!-- Antes que main.js, que es quien lo monta en cuanto tiene el perfil. -->
  <script src="/js/wallpapers.js"></script>
  <!-- La tipografia y el scroll que trae cada fondo. Antes que main.js,
       que es quien los aplica en cuanto sabe cual hay puesto. -->
  <script src="/js/estilos.js"></script>
  <script src="/js/recorrido.js"></script>
  <script src="/js/particles.js"></script>
  <script src="/js/vip-badge.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/button-fx.js"></script>
  <!-- Sin cookies y sin bloquear: ver el encabezado de track.js -->
  <script src="/js/track.js" defer></script>
</body>
</html>
