services:
  - type: web
    name: arleking-social
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: arleking-social-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Enciende el asistente de soporte. Sin ninguna de las dos el soporte
      # sigue funcionando (busca, guía y abre tickets), pero sin conversar.
      # Si están las dos, atiende OpenAI.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
