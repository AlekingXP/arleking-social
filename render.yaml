services:
  - type: web
    name: arleking-social
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: arleking-social-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
